name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Check preparation arithmetic and TypeScript
        run: |
          npm test
          npm run check
      - name: Build bundled English interface
        run: npm run build
      - name: Build and lint Android release
        run: gradle -p android lintRelease assembleRelease assembleDebug --no-daemon
      - name: Prepare installable debug and unsigned production APKs
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/NICU-Work-1.0.1-release-unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/NICU-Work-1.0.1-debug-installable.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/zipalign" -c -P 16 -v 4 artifacts/NICU-Work-1.0.1-release-unsigned.apk > artifacts/alignment.txt
          "$build_tools/apksigner" verify --verbose artifacts/NICU-Work-1.0.1-debug-installable.apk
          cp "$build_tools/lib/apksigner.jar" artifacts/apksigner.jar
          cp package-lock.json artifacts/package-lock.json
          sha256sum artifacts/NICU-Work-1.0.1-release-unsigned.apk artifacts/NICU-Work-1.0.1-debug-installable.apk > artifacts/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NICU-Work-Android
          path: artifacts/
          retention-days: 30
      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-diagnostics
          path: android/app/build/reports/
